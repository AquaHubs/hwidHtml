<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWID Ban Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #4caf50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #4caf50;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #f44336;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background-color: #d32f2f;
        }
        .logs-title {
            margin-top: 20px;
            margin-bottom: 5px;
            font-size: 14px;
            color: #888;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 12px;
            cursor: pointer;
            width: auto;
            margin: 0;
            padding: 0;
        }
        #logs {
            background-color: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 10px;
            height: 160px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #bbb;
        }
        .log-entry {
            margin-bottom: 4px;
            word-break: break-all;
        }
        .log-success { color: #4caf50; }
        .log-error { color: #f44336; }
        .log-info { color: #2196f3; }
        .log-warn { color: #ff9800; }
    </style>
</head>
<body>

<div class="container">
    <h2>HWID Admin Panel</h2>
    
    <div class="form-group">
        <label for="adminKey">Admin Key</label>
        <input type="password" id="adminKey" value="a8g3b5e2kaa" readonly style="opacity: 0.7;">
    </div>

    <div class="form-group">
        <label for="hwid">Target HWID</label>
        <input type="text" id="hwid" placeholder="Вставьте HWID игрока">
    </div>

    <button onclick="banHWID()">Забанить HWID</button>

    <div class="logs-title">
        <span>Логи:</span>
        <button class="clear-btn" onclick="clearLogs()">Очистить</button>
    </div>
    <div id="logs"></div>
</div>

<script>
const ADMIN_KEY = "a8g3b5e2kaa";
const API_URL = "https://hwid-sand.vercel.app/api/ban";

window.onload = function() {
    const savedHWID = localStorage.getItem('saved_hwid');
    if (savedHWID) {
        document.getElementById('hwid').value = savedHWID;
    }
    addLog("Панель запущена и готова к работе", "info");
};

document.getElementById('hwid').addEventListener('input', function(e) {
    localStorage.setItem('saved_hwid', e.target.value);
});

function addLog(message, type = "info") {
    const logsContainer = document.getElementById('logs');
    const time = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = `log-entry log-${type}`;
    entry.textContent = `[${time}] ${message}`;
    logsContainer.appendChild(entry);
    logsContainer.scrollTop = logsContainer.scrollHeight;
}

function clearLogs() {
    document.getElementById('logs').innerHTML = '';
}

async function banHWID() {
    const hwid = document.getElementById('hwid').value.trim();

    if (!hwid) {
        addLog("Ошибка: Поле HWID пустое", "error");
        return;
    }

    addLog(`Отправка запроса на бан HWID: ${hwid}...`, "info");

    const payload = JSON.stringify({ hwid: hwid, adminKey: ADMIN_KEY });

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: payload
        });

        const data = await response.json();

        if (response.ok && data.success) {
            addLog(`УСПЕХ: HWID ${hwid} заблокирован!`, "success");
        } else {
            addLog(`ОШИБКА СЕРВЕРА: ${data.error || 'Неизвестный ответ'}`, "error");
        }
    } catch (err) {
        addLog(`Стандартный запрос отклонен (${err.message}). Пробуем альтернативный метод...`, "warn");

        try {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: payload
            });
            addLog(`Запрос отправлен в режиме no-cors. HWID ${hwid} отправлен в базу.`, "success");
        } catch (fallbackErr) {
            addLog(`КРИТИЧЕСКАЯ ОШИБКА: ${fallbackErr.message}`, "error");
        }
    }
}
</script>

</body>
</html>
